<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史查詢 - 機台監控</title>
    <link rel="stylesheet" href="sensorhistory.css">
    <link rel="stylesheet" href="common.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="main-container">
    <header class="top-section">
        <div class="header-main-row">
            <h1 class="brand-logo">歷史查詢</h1>
            <nav class="nav-menu">
                <a href="index.html" class="nav-btn">HomePage</a>
                <div class="nav-divider"></div>
                <div class="nav-item-dropdown">
                    <a href="productline.html" class="nav-btn">ProductLine</a>
                    <div class="dropdown-content">
                        <a href="control.html" class="dropdown-link">
                            <span class="link-text">ProductLine Control</span>
                            <span class="link-arrow">→</span>
                        </a>
                    </div>
                </div>
                <div class="nav-divider"></div>
                <a href="history.html" class="nav-btn active-tab">HistoryData</a>
                <div class="nav-divider"></div>
                <a href="report.html" class="nav-btn">Log report</a>
                <div class="nav-divider"></div>
                <a href="control.html" class="nav-btn">Control</a>
            </nav>
        </div>
        <div class="header-divider"></div>
    </header>

<main class="content-wrapper">
    <div class="sensor-controls">
        <div class="label-box">感測器</div>
        <div class="select-container">
            <select id="sensor-select" class="styled-select">
                <option value="" disabled selected>------請選擇------</option>
                <option value="temp_hum">溫溼度感測器</option>
                <option value="current">電流感測器</option>
                <option value="co2">CO2 感測器</option>
            </select>
        </div>

        <div class="date-btn-group">
            <button type="button" class="time-btn" id="btn-today">本日</button>
            <button type="button" class="time-btn" id="btn-week">本周</button>
            <button type="button" class="time-btn" id="btn-month">本月</button>
            
            <div class="custom-date-wrapper">
                <button type="button" class="time-btn" id="btn-custom">自訂</button>
                <div class="hidden-pickers">
                    <input type="date" id="custom-start-picker">
                    <input type="date" id="custom-end-picker">
                </div>
            </div>
        </div>

        <div id="date-display-group" class="date-inputs hidden">
            <input type="text" id="display-date-start" class="date-picker-ui" readonly>
            <span class="date-separator">~</span>
            <input type="text" id="display-date-end" class="date-picker-ui" readonly>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="historyChart"></canvas>
    </div>
</main>
</div>
<script src="js/global.js"></script>
<script src="js/sensorhistory.js"></script>
</body>
</html>
