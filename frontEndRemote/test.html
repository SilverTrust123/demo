<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>產線模擬控制 - 修正版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; color: white; }
        #ui-panel {
            position: absolute; top: 20px; right: 20px; width: 300px;
            background: rgba(35, 35, 35, 0.9); border: 1px solid #555;
            border-radius: 8px; padding: 20px; z-index: 100;
        }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        input { width: 50px; text-align: center; border-radius: 4px; border: none; padding: 5px; }
        #start-btn { width: 100%; padding: 12px; background: #004a99; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        #status { font-size: 12px; color: #ffaa00; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div id="ui-panel">
    <h3 style="margin-top:0">機械臂參數設定</h3>
    <div class="row"><span>向下停止 (s)</span><input id="t1" type="number" value="1.0" step="0.5"></div>
    <div class="row"><span>真空等待 (s)</span><input id="t2" type="number" value="1.0" step="0.5"></div>
    <div class="row"><span>旋轉等待 (s)</span><input id="t3" type="number" value="1.0" step="0.5"></div>
    <button id="start-btn">開始模擬循環</button>
    <div id="status">正在加載模型...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls, model;
    let movingPart = null; // 這是我們要移動的零件

    // 初始化
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 10);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    controls = new OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const loader = new GLTFLoader();
    loader.load('./滑台缸.glb', (gltf) => {
        model = gltf.scene;
        scene.add(model);
        model.scale.set(0.05, 0.05, 0.05);

        // 【自動偵測策略】：直接抓取模型裡面的第一個可動零件
        // 這樣就不用管那些亂碼名字了
        model.traverse((child) => {
            if (child.isMesh && !movingPart) {
                // 找到第一個 Mesh，通常這就是 Inventor 匯出的主要零件
                movingPart = child; 
                console.log("已自動鎖定移動件: ", child.name);
            }
        });

        if (movingPart) {
            document.getElementById('status').innerText = "模型就緒，點擊按鈕開始";
            document.getElementById('status').style.color = "#00ff00";
        }
    });

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();

    // 模擬循環
    window.runSim = () => {
        if (!movingPart) return alert("模型尚未加載完成");
        
        const t1 = parseFloat(document.getElementById('t1').value);
        const t2 = parseFloat(document.getElementById('t2').value);
        const t3 = parseFloat(document.getElementById('t3').value);

        const tl = gsap.timeline();
        const st = document.getElementById('status');

        st.innerText = "正在執行循環...";

        // 動作流程：
        tl.to(movingPart.position, { y: "-=50", duration: 1 }) // 1. 下降 (注意：Inventor 單位大，50 比較明顯)
          .to({}, { duration: t1 })                             // 2. 停止時間
          .add(() => st.innerText = "真空吸附中...")
          .to({}, { duration: t2 })                             // 3. 真空等待
          .to(movingPart.position, { y: "+=50", duration: 1 }) // 4. 回升
          .to(movingPart.rotation, { z: "+=" + Math.PI/2, duration: 1 }) // 5. 旋轉 90度
          .to({}, { duration: t3 })                             // 6. 旋轉等待
          .add(() => {
              st.innerText = "循環結束";
              setTimeout(() => st.innerText = "就緒", 2000);
          });
    };

    document.getElementById('start-btn').addEventListener('click', runSim);
</script>
</body>
</html>
