spring.application.name=demo
server.address=0.0.0.0
server.port=9090

logging.file.name=magicSystem.log
#（時間 - 等級 - 訊息）
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=2
# 限制所有 Log 檔案的總容量上限（選填，超額會自動刪除最舊的）
logging.logback.rollingpolicy.total-size-cap=100MB

normal=${NORMAL:10}
important=${IMPORTANT:50}
urgent=${URGENT:100}

thread_count=${THREAD_COUNT:3}
# 3秒
offline_time = ${OFFLINE_TIME:3000}

# 資料庫連線設定
#串env
spring.datasource.url=jdbc:mysql://localhost:3306/icms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# 讓控制台印出 SQL 語句（方便我們 debug 看它有沒有真的存進去）
spring.jpa.show-sql=true
# 讓印出來的 SQL 漂亮一點
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 開啟所有監控點（Demo 時有用，生產環境要收斂）
# 算了懶得收斂了好累
management.endpoints.web.exposure.include=*

# Swagger UI 設定
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

