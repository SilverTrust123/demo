spring.application.name=demo
server.port=9090
logging.file.name=magicSystem.log
#（時間 - 等級 - 訊息）
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

important=${IMPORTANT:50}
normal=${NORMAL:100}
urgent=${URGENT:10}

thread_count=${THREAD_COUNT:5}
# 3秒
offline_time = ${OFFLINE_TIME:3000}

# 資料庫連線設定
spring.datasource.url=jdbc:mysql://localhost:3306/icms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# 讓控制台印出 SQL 語句（方便我們 debug 看它有沒有真的存進去）
spring.jpa.show-sql=true
# 讓印出來的 SQL 漂亮一點
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect