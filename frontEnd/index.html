<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>機台連線測試</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f0f2f5; }
        .panel { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .btn { padding: 15px 30px; font-size: 20px; cursor: pointer; border: none; border-radius: 8px; margin: 10px; color: white; transition: 0.2s; }
        .btn-on { background-color: #28a745; }
        .btn-on:hover { background-color: #218838; }
        .btn-off { background-color: #dc3545; }
        .btn-off:hover { background-color: #c82333; }
        #status { margin-top: 20px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>機台控制測試 (ID: TEST)</h2>
        <button class="btn btn-on" onclick="sendTestSignal(true)">啟動 (ON)</button>
        <button class="btn btn-off" onclick="sendTestSignal(false)">停止 (OFF)</button>
        <p id="status">準備就緒</p>
    </div>

    <script src="test.js"></script>
</body>
</html>
